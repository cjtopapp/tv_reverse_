<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:none}
img{width:100%;height:100%;object-fit:contain;display:none;position:absolute;top:0;left:0}
</style>
</head>
<body>
<img id="img">
<script>
var items=[
{src:"https://pub-1d44c9b74e4842c2aaffab46d0ad62b2.r2.dev/photo_22.png",duration:60000},
{src:"https://pub-1d44c9b74e4842c2aaffab46d0ad62b2.r2.dev/photo_25.png",duration:60000},
{src:"https://pub-1d44c9b74e4842c2aaffab46d0ad62b2.r2.dev/photo_34.png",duration:60000},
{src:"https://pub-1d44c9b74e4842c2aaffab46d0ad62b2.r2.dev/photo_35.png",duration:60000},
{src:"https://pub-1d44c9b74e4842c2aaffab46d0ad62b2.r2.dev/photo_32.png",duration:60000}
];
var idx=0;
var img=document.getElementById("img");
var timer=null;

function play(){
var item=items[idx];
img.style.display="block";
img.src=item.src;
timer=setTimeout(function(){
idx=(idx+1)%items.length;
play();
},item.duration);
}

play();

document.body.addEventListener("click",function(){
if(document.fullscreenElement)return;
document.documentElement.requestFullscreen().catch(function(){});
});
</script>
</body>
</html>
